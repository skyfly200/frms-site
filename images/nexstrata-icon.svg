    <linearGradient id="nxs-p4-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/><stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="512" height="400" rx="96" fill="url(#nxs-bg)"/>

  <g transform="translate(0, -10)">
    <path d="M 172 107 A 95 60 0 0 1 256 70 A 95 60 0 0 1 340 107"
