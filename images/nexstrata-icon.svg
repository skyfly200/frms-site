    <ellipse cx="256" cy="270" rx="3" ry="1.5" fill="#ffffff" filter="url(#nxs-ray-glow)"/>
    <ellipse cx="256" cy="310" rx="2.5" ry="1.2" fill="#ffffff" filter="url(#nxs-ray-glow)"/>

    <g filter="url(#nxs-ray-glow)">
      <circle cx="256" cy="350" r="16" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
      <circle cx="256" cy="350" r="7" fill="#38bdf8"/>
      <circle cx="256" cy="350" r="3" fill="#ffffff"/>
