    <polygon points="256,290 292,270 256,270" fill="url(#nxs-p3-right)"/>

    <polygon points="240,310 256,298 256,310" fill="url(#nxs-p4-left)"/>
    <polygon points="256,298 272,310 256,310" fill="url(#nxs-p4-right)"/>
    <line x1="256" y1="290" x2="256" y2="310" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#nxs-ray-glow)"/>
    <polygon points="240,310 256,322 256,310" fill="url(#nxs-p4-left)"/>
    <polygon points="256,322 272,310 256,310" fill="url(#nxs-p4-right)"/>

    <line x1="256" y1="322" x2="256" y2="350" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#nxs-ray-glow)"/>

