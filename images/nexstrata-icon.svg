    <polygon points="176,150 256,180 256,150" fill="url(#nxs-p1-left)"/>
    <polygon points="256,180 336,150 256,150" fill="url(#nxs-p1-right)"/>

    <polygon points="198,215 256,190 256,215" fill="url(#nxs-p2-left)"/>
